{% extends "recomendacao/home.html" %}
{% load static %}
{% block content%}
  {% block link %}
      <link rel="stylesheet" type="text/css" href="{% static 'css/recommendation.css' %}" media="screen" />
      <title>Recomendação</title>
  {% endblock link %}
  <link rel="stylesheet" href="recommendation.css">
  <body>
      <header class="header p-1">
        <h1>Informe seus dados</h1>
        <nav>
          <a href="{% url 'home' %}" class="row justify-content-start nav-button-voltar m-4">Voltar</a>
        </nav>
      </header>
      <form method="POST" action="{% url 'new_recomendation' %}">
          {% csrf_token %}
        
          <label for="altura">Altura (cm):</label>
          <input type="number" id="altura" name="altura" min="50" max="250" required placeholder="ex: 175" autofocus><br>
        
          <label for="peso">Peso (kg):</label>
          <input type="number" id="peso" name="peso" min="20" max="200" required placeholder="ex: 80"><br>

          <label for="nivel_atividade">Nível de Atividade Física:</label>
          <select id="nivel_atividade" name="nivel_atividade" required>
            <option value="sedentario">Sedentário</option>
            <option value="iniciante">Iniciante</option>
            <option value="intermediario">Intermediário</option>
            <option value="avancado">Avançado</option>
          </select><br>
        
          <label for="objetivo">Objetivo:</label>
          <select id="objetivo" name="objetivo" required>
            <option value="emagrecimento">Emagrecimento</option>
            <option value="ganhar_massa_muscular">Ganho de Massa Muscular</option>
            <option value="condicionamento">Condicionamento Físico</option>
            <option value="melhora_na_saude">Melhora Geral da Saúde</option>
            <option value="outro">Outro</option>
          </select><br>


          <label for="restricao">Condições Médicas:</label>
          <select id="restricao" name="restricao" required>
            <option value="saudavel">Saudável</option>
            <option value="lesoes_musculares">Lesões Musculares ou Articulares</option>
            <option value="problemas_cardiacos">Problemas Cardíacos</option>
            <option value="diabetes">Diabetes</option>
            <option value="problemas_respiratorios">Asma ou Problemas Respiratórios</option>
            <option value="deficiencias_nutricionais">Deficiências Nutricionais</option>
            <option value="coluna">Problemas na Coluna</option>
          </select><br>
        
          <label for="local_treino">Local de Treino Preferido:</label>
          <select id="local_treino" name="local_treino" required>
            <option value="academia">Academia</option>
            <option value="casa">Casa</option>
            <option value="parque">Parque</option>
            <option value="outro">Outro</option>
          </select><br>
        
          <label for="duracao_treino">Duração do Treino:</label>
          <select id="duracao_treino" name="duracao_treino" required>
            <option value="30">Até 30 minutos</option>
            <option value="45">Até 45 minutos</option>
            <option value="60">Até 1 hora</option>
            <option value="mais">Mais de 1 hora</option>
          </select><br><br>
        
          <button type="submit">Gerar Recomendação</button>
      </form>
  </body>
{% endblock content%}
