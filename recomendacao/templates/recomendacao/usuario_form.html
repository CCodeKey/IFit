<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignIn</title>
</head>
<body>
    <h2>Criar nova conta</h2>
    <a href="{% url 'index' %}">home</a>
    
    <form method="POST" action="{% url 'signin' %}">
        {% csrf_token %}
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="digite seu primeiro nome" required value={{ nome }}><br>
    
        <label for="nome">Sobrenome:</label>
        <input type="text" id="sobrenome" name="sobrenome" placeholder="digite seu sobrenome" required value={{ sobrenome }}><br>
    
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required><br>
        
        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" placeholder="digite sua senha" required value={{ password }}><br>
        
        <label for="password">Confirme sua senha:</label>
        <input type="password" id="comfirm-password" name="comfirm-password" placeholder="confirme sua senha" required><br>
        
        <button type="submit" value="Submit">Criar</button>
      </form> 
      <a href="{% url 'login' %}">ja tenho uma conta</a>
</body>
</html>
